spring:
  application:
    name: differentiated-policy
  config:
    # 兼容 IDEA 从项目根目录启动，以及脚本从 backend/ 目录启动。
    import:
      - optional:file:backend/.env.local.properties
      - optional:file:.env.local.properties
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 5000
      initialization-fail-timeout: -1
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: POLICY_SESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never
feishu:
  tenant-key: ${FEISHU_TENANT_KEY:}
  app-id: ${FEISHU_APP_ID:}
  app-secret: ${FEISHU_APP_SECRET:}
  allowed-origins: ${FEISHU_ALLOWED_ORIGINS:}
  policy-chat-id: ${FEISHU_POLICY_CHAT_ID:}
  policy-callback-mode: ${FEISHU_POLICY_CALLBACK_MODE:http}
  callback-encrypt-key: ${FEISHU_CALLBACK_ENCRYPT_KEY:}
  callback-verification-token: ${FEISHU_CALLBACK_VERIFICATION_TOKEN:}
  request-timeout-seconds: ${FEISHU_REQUEST_TIMEOUT_SECONDS:10}
jackyun:
  app-key: ${JACKYUN_APP_KEY:}
  app-secret: ${JACKYUN_APP_SECRET:}
  token: ${JACKYUN_TOKEN:}
  source-key: ${JACKYUN_SOURCE_KEY:jackyun}
  import-interval-seconds: ${JACKYUN_IMPORT_INTERVAL_SECONDS:5}
  import-max-pages: ${JACKYUN_IMPORT_MAX_PAGES:2000}
  import-scheduling-enabled: ${JACKYUN_IMPORT_SCHEDULING_ENABLED:true}
  clean-scheduling-enabled: ${JACKYUN_CLEAN_SCHEDULING_ENABLED:true}
  import-poll-interval-ms: ${JACKYUN_IMPORT_POLL_INTERVAL_MS:2000}
  clean-poll-interval-ms: ${JACKYUN_CLEAN_POLL_INTERVAL_MS:2000}
  request-timeout-seconds: ${JACKYUN_REQUEST_TIMEOUT_SECONDS:20}
policy:
  review-delivery-enabled: ${POLICY_REVIEW_DELIVERY_ENABLED:false}
  review-delivery-poll-ms: ${POLICY_REVIEW_DELIVERY_POLL_MS:3000}
  storage:
    root: ${POLICY_STORAGE_ROOT:}
external:
  http:
    connect-timeout-seconds: ${HTTP_CONNECT_TIMEOUT_SECONDS:5}
knife4j:
  # /doc.html 接口文档页面仍可使用；关闭与 Springdoc 2.8 不兼容的
  # Knife4j 4.5 可选增强定制功能。
  enable: false
springdoc:
  api-docs:
    path: /v3/api-docs
