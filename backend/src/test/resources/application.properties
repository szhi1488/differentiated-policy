spring.datasource.url=jdbc:h2:mem:policy;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:user-info-schema.sql
jackyun.import-scheduling-enabled=false
jackyun.clean-scheduling-enabled=false
